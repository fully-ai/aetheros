[package]
name = "aetheros-kernel"
version = "0.2.0-beta.1"
edition = "2021"
license = "MIT"
description = "AetherOS independent modular x86_64 operating system kernel"

[[bin]]
name = "aetheros"
path = "src/main.rs"
test = false
bench = false

[dependencies]
aether-abi = { path = "../crates/aether-abi", default-features = false }
aether-uuid = { path = "../crates/aether-uuid", default-features = false }
aether-fs-core = { path = "../crates/aether-fs-core", default-features = false }
aether-elf = { path = "../crates/aether-elf", default-features = false }

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 2
lto = "thin"
debug = true
