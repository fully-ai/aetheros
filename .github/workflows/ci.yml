name: AetherOS CI (Build, Lint, Host Unit Tests & QEMU UEFI/BIOS Verification)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Build, Format, Clippy & QEMU Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AetherOS
        uses: actions/checkout@v4

      - name: Install System Dependencies (QEMU, OVMF, mtools, parted, nasm)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 \
            ovmf \
            mtools \
            dosfstools \
            parted \
            gdisk \
            nasm \
            git \
            curl

      - name: Install Rust Toolchain (stable + x86_64-unknown-none)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
          components: rust-src, llvm-tools-preview, rustfmt, clippy

      - name: Verify Formatting (rustfmt)
        run: ./scripts/format.sh --check

      - name: Run Clippy Lints (Host Crates, Kernel & Ring 3 Userspace)
        run: ./scripts/lint.sh

      - name: Run Host Unit & Fuzz Smoke Tests + QEMU UEFI & BIOS Self-Tests
        run: ./scripts/test.sh
